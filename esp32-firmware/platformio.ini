; PlatformIO Project Configuration File
; Firmware simulasi streaming sensor suhu terenkripsi (SPECK64/128-CTR +
; HMAC-SHA256) untuk ESP32-S3, sesuai dokumen rancangan benchmarking.
;
; Board terkonfirmasi: modul "ESP32 S3 N16R8" -- ESP32-S3 dengan Flash 16MB
; (Quad SPI) + PSRAM 8MB (Octal SPI). Base board tetap memakai definisi
; generik `esp32-s3-devkitc-1` dari platform espressif32 (nama board persis
; untuk modul clone/generik sering tidak ada di daftar resmi PlatformIO),
; TAPI ukuran flash & tipe PSRAM di-override manual di bawah (`board_build.*`)
; supaya cocok dengan chip N16R8 yang sebenarnya -- default board ini
; aslinya mengasumsikan 8MB flash TANPA PSRAM, yang salah untuk board kamu.
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- Override untuk varian N16R8 (16MB Flash Quad SPI + 8MB PSRAM Octal SPI) ---
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv   ; skema partisi resmi utk flash 16MB
board_upload.flash_size = 16MB
board_build.psram_type = opi                ; PSRAM 8MB varian R8 = Octal SPI (OPI)
board_build.arduino.memory_type = qio_opi   ; Flash Quad I/O + PSRAM Octal I/O

; Sesuai keputusan desain: jalur komunikasi tahap pertama adalah UART/USB
; Serial (bukan WiFi/MQTT), jadi upload & monitor lewat port USB bawaan.
monitor_speed = 115200
upload_speed = 921600

; monitor_port / upload_port dikosongkan agar PlatformIO auto-detect;
; override manual jika perlu, contoh:
; upload_port = /dev/ttyACM0
; monitor_port = /dev/ttyACM0
; Windows, contoh:
; upload_port = COM5
; monitor_port = COM5

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -std=gnu++17
    -O2
build_unflags =
    -std=gnu++11

; Adafruit BME280 driver DIPASANG agar firmware siap dipakai begitu sensor
; fisik datang (lihat sensor.cpp: firmware mencoba inisialisasi BME280 lewat
; I2C saat boot; jika tidak terdeteksi, otomatis jatuh ke mode sintetis).
lib_deps =
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit Unified Sensor @ ^1.1.14

monitor_filters = time, colorize
